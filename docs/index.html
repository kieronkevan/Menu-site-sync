<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zhejiang Garden — Menu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header" id="header">
  <h1 id="shop-name">Zhejiang Garden</h1>
  <p class="sub" id="shop-details">12 High Street, Anytown &middot; Mon&ndash;Sun 5&ndash;10:30pm</p>
  <a class="call-button" id="call-button" href="tel:">
    <span class="icon">&#128222;</span> <span id="phone-text"></span>
  </a>
</header>

<button id="search-trigger" class="search-trigger">
  <span class="search-icon" aria-hidden="true">&#128269;</span>
  <span>Search dishes...</span>
</button>

<div class="notice" id="notice" hidden></div>

<nav class="chips" id="chips"></nav>

<main id="menu"></main>

<footer class="site-footer">
  <p id="footer-details"></p>
  <p><a id="footer-phone" href="tel:"></a></p>
</footer>

<div id="search-overlay" class="search-overlay">
  <div class="search-overlay-header">
    <span class="search-icon" aria-hidden="true">&#128269;</span>
    <input type="text" id="search-input" placeholder="Search dishes..." autocomplete="off">
    <button id="search-close" class="search-close">Cancel</button>
  </div>
  <div id="search-results"></div>
</div>

<script src="script.js"></script>
</body>
</html>
