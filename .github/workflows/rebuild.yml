name: Sync menu from Notion

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 minutes
  workflow_dispatch: {}      # lets you trigger it manually from GitHub too

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull latest menu data from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MENU_DB_ID: ${{ secrets.NOTION_MENU_DB_ID }}
          NOTION_INFO_DB_ID: ${{ secrets.NOTION_INFO_DB_ID }}
        run: node scripts/sync-notion.js

      - name: Commit updated data if it changed
        run: |
          git config user.name "menu-sync-bot"
          git config user.email "actions@github.com"
          git add site/menu-data.json
          git diff --cached --quiet || git commit -m "Update menu data from Notion"
          git push
